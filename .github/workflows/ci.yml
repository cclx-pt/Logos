name: CI

# v3-cursos incluida (09-06-2026): durante a fase de 3 camadas, as PRs de V3
# abrem contra v3-cursos e ficavam sem CI nenhum (so pipeline local). O motivo
# original de limitar a main era poupar minutos do plano gratuito, mas o repo
# e publico desde 12-05-2026 e Actions e gratuito/ilimitado em repos publicos.
on:
  pull_request:
    branches: [main, v3-cursos]
  push:
    branches: [main, v3-cursos]

# Cancela runs in-progress no mesmo ref (PR ou branch) quando chega push novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Test · Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Versão é lida automaticamente do campo `packageManager` em package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (estrito — falha em warnings)
        run: pnpm exec eslint --max-warnings 0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check
